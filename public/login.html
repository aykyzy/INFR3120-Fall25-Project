<!---indicates to the user if it is an html document or not-->
<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Login</title></head>
<body>

<!--navbalinks on top of page-->
<nav>
<a href="/index.html">Home</a>
<a href="/create.html">Create Survey</a>
<a href="/list.html">List Surveys</a>
<!---login link is hidden if the user is already logged in-->
<a href="/login" id="login-link">Login</a>
<!---logout button showed if the user is already logged in-->
<form id="logout-form" method="POST" action="/logout"
style="display:none;display:inline;margin:0;padding:0;">
<button type="submit">Logout</button>
</form>
</nav>

<!--login header-->
<h1>Login</h1>
<!---Login form sends user and password to the user-->
<form method="POST" action="/login">

<!---Username label-->
<label>Username</label>
<!---Username input-->
<input name="username" required>
<!--password label-->
<label>Password</label>
<!---password input-->
<input type="password" name="password" required>
<!--submit button-->
<button type="submit">Login</button>
</form>
<!---if the user doesnt have a login it takes them to the register page-->
<p>No account? <a href="/register">Register</a></p>

<!--ask backend if user is logged in-->
<script>
fetch('/auth/status')
.then(r=>r.json())
.then(d=>{
// If logged in: hide Login link and show Logout button
document.getElementById("login-link").style.display = d.loggedIn?"none":"inline";
document.getElementById("logout-form").style.display = d.loggedIn?"inline":"none";
});
</script>
</body>
</html>
