<!--Stating document type-->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" href="style.css">
        <title>All Surveys | SurveySimple</title>
        <script src="app.js" defer></script>
    </head>
    <body>
        <a href="/index.html">Home</a>
        <a href="/create.html">Create Survey</a>
        <a href="/list.html">List Surveys</a>
        <!---login link is hidden if the user is already logged in-->
        <a href="/login" id="login-link">Login</a>
        <!---logout button showed if the user is already logged in-->
        <form id="logout-form" method="POST" action="/logout" style="display:none;display:inline;margin:0;padding:0;">
        <button type="submit">Logout</button>
        <header class="site">
        <header class="site">
            <div>
                <img src="images/logo.png" style="height:60px; margin-right:10px;">
                <h1>SurveySimple</h1>
            </div>
        </header>
            <div class="center">
                <a class="btn" href="index.html">Home</a>
                <a class="btn btn--ghost" href="create.html">Create New Survey</a>
            </div>
        <div>
            <table id="surveyTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Questions</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="surveyTbody">
                    <!--Surveys will be in here-->
                </tbody>
            </table>
        </div>
    </body>
</html>
