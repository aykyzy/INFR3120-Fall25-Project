<!--Stating document type-->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="app.js" defer></script>
    </head>
<!--Main body of site, including header, and 2 sections (hero and table)-->
<body class="login-page">
    <nav class="Home-indexcontainer">

        <a href="/index.html" class="header-link Home-index">Home</a>
        <a href="/create.html" class="header-link Create-index">Create Survey</a>
        <a href="/list.html" class="header-link List-index">List Surveys</a>

        <a href="/login" id="login-link" class="header-link Login-index">Login</a>
        <a href="/change-password" class="header-link">Change Password</a>

        <form id="logout-form" class="logout-form" method="POST" action="/logout"
              style="display:none; display:inline; margin:0; padding:0;">
            <button type="submit" class="header-link Logout-index" style="background:none;border:none;">
                Logout
            </button>
        </form>

    </nav>

    <header class="site">
        <div>
            <img src="images/logo.png" style="height:60px; margin-right:10px;">
            <h1>SurveySimple</h1>
        </div>
    </header>
</body>

        
        
<!--Hero section with two buttons to navigate to creation of survey, and viewing-->
        <section class="hero">
            <p>Create, Share and Explore Surveys!</p>
            <a class="btn" href="create.html">Create New Survey</a>
            <a class="btn btn--ghost" href="list.html">View Surveys</a>
        </section>
<!--Table with list of active surveys available-->
        <section class="table">
            <h2 class="center">Active Surveys</h2>
            <table id="surveyTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="surveyTbody">
                    <!--table will be dynamically inseretd into here, listing all surveys-->    
                </tbody>
            </table>
        </section>
    </body>
</html>
