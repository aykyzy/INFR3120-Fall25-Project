<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Change Password | SurveySimple</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<nav class="Home-indexcontainer">

    <a href="/index.html" class="header-link Home-index">Home</a>
    <a href="/create.html" class="header-link Create-index">Create Survey</a>
    <a href="/list.html" class="header-link List-index">List Surveys</a>
    <a href="/change-password" class="header-link">Change Password</a>

    <a href="/login" id="login-link" class="header-link Login-index">Login</a>

    <form id="logout-form" class="logout-form" method="POST" action="/logout"
          style="display:none; display:inline; margin:0; padding:0;">
        <button type="submit" class="header-link Logout-index" style="background:none;border:none;">
            Logout
        </button>
    </form>

</nav>

<header class="site">
    <div>
        <img src="images/logo.png" style="height:60px; margin-right:10px;">
        <h1>SurveySimple</h1>
    </div>
</header>

<div class="center" style="margin-top:30px;">

    <h2>Change Password</h2>

    <form method="POST" action="/change-password" style="max-width:400px;margin:auto;text-align:left;">

        <label>Current Password:</label>
        <input type="password" name="currentPassword" required>

        <label>New Password:</label>
        <input type="password" name="newPassword" required>

        <label>Confirm New Password:</label>
        <input type="password" name="confirmPassword" required>

        <button type="submit" class="btn" style="margin-top:20px;">
            Update Password
        </button>

    </form>

</div>

<script>
// automatically toggle login/logout
fetch('/auth/status')
.then(r=>r.json())
.then(d=>{
    document.getElementById("login-link").style.display = d.loggedIn ? "none" : "inline";
    document.getElementById("logout-form").style.display = d.loggedIn ? "inline" : "none";
});
</script>

</body>
</html>
